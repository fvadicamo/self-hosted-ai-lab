#cloud-config

# ============================================================
# Self-hosted AI setup - current Ubuntu LTS (the release is not pinned: see the Docker note)
# Replace all <PLACEHOLDER> values before use
# ============================================================

hostname: <HOSTNAME>
# fqdn: <HOSTNAME>.example.com
# Uncomment fqdn only if you have a DNS A record pointing to this server's IP
manage_etc_hosts: true

timezone: Europe/Rome

package_update: true
package_upgrade: true
package_reboot_if_required: false  # managed by power_state

packages:
  # Required for Docker HTTPS repo
  - apt-transport-https
  - ca-certificates
  - gnupg
  # Base utilities
  - curl
  - git
  - htop
  - wget
  - ufw
  - jq
  - iputils-ping
  # Python
  - python3-pip
  - python3-venv
  # Security
  - fail2ban
  - unattended-upgrades

users:
  - name: <USER>
    # `adm` grants read access to the system journal and to /var/log files owned
    # by root:adm. It is not extra privilege: this user already has passwordless
    # sudo, so it can read those anyway. What it buys is that `journalctl -u <unit>`
    # works without sudo — and, more importantly, that forgetting sudo produces an
    # error instead of an empty result. Without `adm`, journalctl exits 0 and prints
    # nothing, which reads as "nothing ever happened" rather than "I could not look".
    #
    # Why this has to be stated here at all: the Ubuntu *installer* puts the first
    # user in `adm` automatically, cloud-init does not. So a workstation installed
    # from ISO and a VPS provisioned from this template end up with different group
    # sets for the same person — and the difference only shows up months later, as a
    # diagnostic command that quietly returns nothing on some nodes and not others.
    groups: [sudo, adm]
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    lock_passwd: true
    ssh_authorized_keys:
      - <SSH_PUBLIC_KEY>

# Make cloud-init itself declare key-only auth. Without this, cloud-init writes
# /etc/ssh/sshd_config.d/50-cloud-init.conf containing `PasswordAuthentication yes`,
# and that file WINS over the hardening drop-in below — see the comment there.
ssh_pwauth: false

write_files:
  # SSH hardening drop-in.
  #
  # WARNING, and it is the opposite of the intuition: sshd_config does its
  # `Include /etc/ssh/sshd_config.d/*.conf` near the TOP of the file, and for most
  # keywords OpenSSH keeps the FIRST value it sees, not the last. So a drop-in does
  # not "override" anything by sorting late — a 99- file LOSES to a 50- file.
  # This one is safe only because `ssh_pwauth: false` above stops cloud-init from
  # writing a conflicting 50-cloud-init.conf. Verify, never assume:
  #   sudo sshd -T -C user=<USER>,host=example,addr=203.0.113.1 | grep -i passwordauth
  # (`sshd -T` alone ignores Match blocks; `-C` resolves them.)
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root:root
    permissions: '0644'
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      KbdInteractiveAuthentication no
      AllowUsers <USER>
      MaxAuthTries 3
      LoginGraceTime 30
      AuthorizedKeysFile .ssh/authorized_keys

  # Fail2Ban
  - path: /etc/fail2ban/jail.local
    owner: root:root
    permissions: '0644'
    content: |
      [DEFAULT]
      bantime  = 3600
      findtime = 600
      maxretry = 3
      mode     = normal
      backend  = systemd

      [sshd]
      enabled = true
      port    = 22
      logpath = %(sshd_log)s

  # Automatic security updates
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

runcmd:
  # --- Docker (official install) ---
  # The codename is read from the system, NOT hardcoded. Providers hand you the newest
  # Ubuntu and do not let you choose: a machine provisioned from this template came up as
  # 26.04 and would have pulled Docker packages from the 24.04 repository forever.
  # Sourcing /etc/os-release runs no external binary, so it does not have the PATH problem
  # that made `lsb_release -cs` unusable here.
  # Before trusting it on a brand-new release, check that Docker has published for it:
  #   curl -sI https://download.docker.com/linux/ubuntu/dists/<codename>/Release
  # A 404 means you must pin to the newest covered release -- deliberately, and knowing it.
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  # Add user to docker group AFTER install (group doesn't exist before)
  - usermod -aG docker <USER>

  # --- Docker log rotation ---
  - |
    cat > /etc/docker/daemon.json << 'DAEMON'
    {
      "log-driver": "json-file",
      "log-opts": {
        "max-size": "10m",
        "max-file": "3"
      }
    }
    DAEMON
  - systemctl restart docker

  # --- Swap (2 GB, useful for instances with 4 GB RAM or less) ---
  - fallocate -l 2G /swapfile
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # --- lazydocker ---
  - curl -fsSL https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | DIR=/usr/local/bin bash

  # --- Docker root directory with correct permissions ---
  - mkdir -p /srv/docker
  - chown root:docker /srv/docker
  - chmod 2770 /srv/docker

  # --- UFW (second layer - first layer is provider firewall) ---
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw --force enable

  # --- Fail2Ban ---
  - systemctl enable fail2ban
  - systemctl start fail2ban

power_state:
  mode: reboot
  delay: now
  timeout: 30
  message: "Provisioning complete - rebooting"
  condition: true
